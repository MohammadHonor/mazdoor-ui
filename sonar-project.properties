# SonarCloud Project Key & Org
sonar.projectKey=mohammadhonor
sonar.organization=mohammadhonor

# SonarCloud Host URL
sonar.host.url=https://sonarcloud.io

# Auth Token (insert your real token or use env variable)
sonar.login=${SONAR_TOKEN}

# Display info in UI
sonar.projectName=mazdoor-ui
sonar.projectVersion=1.0

# Sources and Tests
sonar.sources=.
sonar.tests=.
sonar.sourceEncoding=UTF-8

# Coverage (Next.js + Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# File Suffixes
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Inclusions/Exclusions
sonar.inclusions=**/*.js,**/*.jsx,**/*.ts,**/*.tsx
sonar.test.inclusions=**/__tests__/**,**/cypress/**,**/*.test.ts,**/*.test.js,**/*.test.tsx,**/*.test.jsx
sonar.exclusions=**/*.config.ts,**/*.config.js,**/*.setup.ts,**/*.setup.js,.lintstagedrc.js,**/components/ui/**/*
